<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft Quantum hero</title>
<style>
  body{margin:0;background:#0D0D10;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .qc-hero{position:relative;width:100%;max-width:1967px;aspect-ratio:1967/1107;container-type:inline-size;overflow:hidden;
    background:#0D0D10;font-family:"Segoe UI","Inter",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#fff}
  .qc-hero::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:1.67cqw 1.67cqw;
    -webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 45%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 75% 85% at 50% 45%,#000 45%,transparent 100%)}
  .qc-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 38% 30% at 50% 17%,rgba(0,120,212,.32),transparent 70%)}
  .qc-main{position:absolute;z-index:2;left:18.5%;top:17.2%;width:63%;border-radius:.8cqw;overflow:hidden;border:1px solid #1B1B21;box-shadow:0 2cqw 5cqw rgba(0,0,0,.6)}
  .qc-main img{display:block;width:100%;height:auto;image-rendering:-webkit-optimize-contrast}
  .qc-card{position:absolute;z-index:3;box-sizing:border-box;border-radius:1.1cqw;padding:2.2cqw .75cqw .75cqw;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(24,24,30,.42);
    -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);
    opacity:0;will-change:transform,opacity}
  .qc-card img{display:block;width:100%;height:auto;border-radius:.55cqw}
  .qc-badge{position:absolute;top:-1.7cqw;left:1cqw;height:3.3cqw;padding:0 1.2cqw 0 .8cqw;border-radius:2cqw;background:#0F6CBD;
    display:flex;align-items:center;gap:.6cqw;font-size:1.2cqw;font-weight:600;color:#fff;white-space:nowrap}
  .qc-badge i{width:2.2cqw;height:2.6cqw;display:grid;place-items:center}
  .qc-badge svg{width:1.6cqw;height:1.6cqw}
  .qc-test {left:7.6%; top:57.8%;width:25.3%}
  .qc-iter {left:58.5%;top:77.7%;width:29.9%}
  .qc-learn{left:76.3%;top:26.2%;width:16.7%}
  .qc-prog {left:12.7%;top:6.6%; width:16.7%;z-index:1}
  .qc-test {animation:qc-pop-1 7s infinite}
  .qc-iter {animation:qc-pop-2 7s infinite}
  .qc-learn{animation:qc-pop-3 7s infinite}
  .qc-prog {animation:qc-pop-4 7s infinite}
  @keyframes qc-pop-1{0%,4.29%{opacity:0;transform:scale(.6)}9%{opacity:1;transform:scale(1.06)}12.14%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @keyframes qc-pop-2{0%,12.86%{opacity:0;transform:scale(.6)}17.57%{opacity:1;transform:scale(1.06)}20.71%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @keyframes qc-pop-3{0%,21.43%{opacity:0;transform:scale(.6)}26.14%{opacity:1;transform:scale(1.06)}29.29%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @keyframes qc-pop-4{0%,30%{opacity:0;transform:scale(.6)}34.71%{opacity:.55;transform:scale(1.06)}37.86%,80%{opacity:.55;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @media (prefers-reduced-motion:reduce){.qc-card{animation:none!important;opacity:1}.qc-prog{opacity:.55}}
</style>
</head>
