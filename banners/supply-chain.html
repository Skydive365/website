<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Chain Manager hero</title>
<style>
  body{margin:0;background:#F7F6F3;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .sc-hero{position:relative;width:100%;max-width:1967px;aspect-ratio:1967/1107;container-type:inline-size;overflow:hidden;
    background:#F7F6F3;font-family:"Segoe UI","Inter",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#1F2A44}
  .sc-hero::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(20,25,45,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(20,25,45,.055) 1px,transparent 1px);
    background-size:1.67cqw 1.67cqw;
    -webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 45%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 75% 85% at 50% 45%,#000 45%,transparent 100%)}
  .sc-hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 42% 34% at 50% 16%,rgba(242,107,29,.30),transparent 72%)}
  .sc-main{position:absolute;z-index:2;left:18.5%;top:15%;width:63%;border-radius:.8cqw;overflow:hidden;
    border:1px solid rgba(20,25,45,.08);box-shadow:0 2cqw 5cqw rgba(30,40,80,.18)}
  .sc-main img{display:block;width:100%;height:auto}
  .sc-card{position:absolute;z-index:3;box-sizing:border-box;width:22%;border-radius:1.1cqw;padding:2.4cqw 1.4cqw 1.3cqw;
    display:flex;align-items:center;gap:1.1cqw;
    background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.45));
    -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 1.2cqw 3cqw rgba(30,40,80,.16),inset 0 1px 0 rgba(255,255,255,1);
    opacity:0;will-change:transform,opacity}
  .sc-card img{flex:none;width:7cqw;height:7cqw;object-fit:contain;filter:drop-shadow(0 .5cqw .7cqw rgba(30,40,80,.18))}
  .sc-card p{margin:0;font-size:1.25cqw;line-height:1.35;font-weight:500;color:#1F2A44}
  .sc-badge{position:absolute;top:-1.7cqw;left:1cqw;height:3.3cqw;padding:0 1.2cqw 0 .8cqw;border-radius:2cqw;background:#111114;
    display:flex;align-items:center;gap:.6cqw;font-size:1.2cqw;font-weight:600;color:#fff;white-space:nowrap}
  .sc-badge i{width:2.2cqw;height:2.6cqw;display:grid;place-items:center}
  .sc-badge svg{width:1.6cqw;height:1.6cqw}
  .sc-plan   {left:6.5%; top:9%}
  .sc-monitor{left:71%;  top:47%}
  .sc-dates  {left:6%;   top:68%}
  .sc-plan   {animation:sc-pop-1 7s infinite}
  .sc-monitor{animation:sc-pop-2 7s infinite}
  .sc-dates  {animation:sc-pop-3 7s infinite}
  @keyframes sc-pop-1{0%,4.29%{opacity:0;transform:scale(.6)}9%{opacity:1;transform:scale(1.06)}12.14%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @keyframes sc-pop-2{0%,12.86%{opacity:0;transform:scale(.6)}17.57%{opacity:1;transform:scale(1.06)}20.71%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @keyframes sc-pop-3{0%,21.43%{opacity:0;transform:scale(.6)}26.14%{opacity:1;transform:scale(1.06)}29.29%,80%{opacity:1;transform:scale(1)}87.1%,100%{opacity:0;transform:scale(.96)}}
  @media (prefers-reduced-motion:reduce){.sc-card{animation:none!important;opacity:1}}
</style>
</head>
